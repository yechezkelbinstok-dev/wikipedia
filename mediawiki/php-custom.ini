; Scribunto parses of heavy articles need headroom.
memory_limit = 512M
max_execution_time = 300

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The application code is bind-mounted and edited in place, so opcache must
; notice when a file changes. With this off, a deploy that rewrites an existing
; PHP file leaves every web request serving stale bytecode until the container
; is restarted — which presents as a hard 500 on every page while CLI
; maintenance scripts still work. The revalidation costs one stat() per
; included file per request: microseconds against a page render.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

apc.enable_cli = 1
apc.shm_size = 128M

; PHP notices must never reach the browser. They were being printed above the
; page — which pushed the logo out of the header — and, worse, prepended to
; JSON responses, so the search box's suggestion request came back unparseable
; and sat on "Loading search suggestions" forever. Errors belong in the log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
