# 4 GB box: cap workers so PHP can't starve MariaDB.
<IfModule mpm_prefork_module>
	StartServers            2
	MinSpareServers         2
	MaxSpareServers         5
	MaxRequestWorkers       12
	MaxConnectionsPerChild  500
</IfModule>

# Wikipedia-style article URLs: /wiki/Article_Name -> /index.php
RewriteEngine On
RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/index.php [L]
